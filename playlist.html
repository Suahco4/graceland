<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Messages</title>
    <link rel="stylesheet" href="playlist.css">
</head>
<body>
    <div id="fireflies-container"></div> <!-- New container for dynamic fireflies -->

    <div class="playlist-container">
        <h2>The Messages</h2>
        <select id="playlist-select">
            <option value="" disabled selected>Bless Your Heart</option>
            <option value="Mother Piah.mp3" 
                    data-title="Unity - Mot. Theresa Piah">
                </option>
            
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" 
                    data-title="Song 2 - Chill Vibes"
                <div><img src="" alt=""></div>
                    data-image="https://images.unsplash.com/photo-1510915361894-db8b60106cb1?auto=format&fit=crop&q=80">Song 2 - Chill Vibes</option>
            
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" 
                    data-title="Song 3 - Energetic Beat" 
                    data-image="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&q=80">Song 3 - Energetic Beat</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" 
                    data-title="Song 4 - Relaxing Melody" 
                    data-image="https://images.unsplash.com/photo-1507838153414-b4b713384a76?auto=format&fit=crop&q=80">Song 4 - Relaxing Melody</option>
        </select>
        <p id="selected-song">Listing to the message</p>
        <img id="song-image" src="Logo.png" alt="Song Profile Image" style="display: none;">
        <audio id="audio-player" controls></audio>
    </div>

    <script src="playlist.js"></script>
</body>
</html>
