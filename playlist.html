<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Listing to the Messages</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#0e0f13;
      --card:#151822;
      --text:#e8ecf1;
      --muted:#9aa3b2;
      --accent:#6aa6ff;
      --accent-2:#9b6aff;
      --accent-3:#3ddc97;
      --border:#222739;
      --active:#1f2540;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
      background: radial-gradient(1000px 600px at 85% -10%, #1a1f36 0%, var(--bg) 60%), var(--bg);
      color:var(--text);
      display:flex;
      min-height:100vh;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .player{
      width:min(780px, 100%);
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.0)), var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
      overflow:hidden;
    }
    .header{
      display:flex;
      align-items:center;
      gap:16px;
      padding:18px 20px;
      border-bottom:1px solid var(--border);
      background: linear-gradient(90deg, rgba(106,166,255,0.08), rgba(155,106,255,0.08) 60%, transparent);
    }
    .cover{
      width:86px;height:86px; border-radius:10px; object-fit:cover; flex:0 0 auto; border:1px solid var(--border);
    }
    .meta{display:flex; flex-direction:column; gap:6px; min-width:0}
    .title{font-weight:700; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .artist{color:var(--muted); font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .subtle{color:var(--muted); font-size:.85rem}
    .grid{
      display:grid;
      grid-template-columns: 1fr 260px;
      gap:0;
    }
    @media (max-width: 720px){
      .grid{grid-template-columns: 1fr}
    }

    .controls{
      padding:14px 16px;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px 14px;
      border-bottom:1px solid var(--border);
    }
    .btn{
      appearance:none;
      border:1px solid var(--border);
      background:#171a24;
      color:var(--text);
      border-radius:10px;
      padding:8px 10px;
      cursor:pointer;
      line-height:1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      transition:transform .05s ease, background .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease;
      user-select:none;
    }
    .btn:hover{background:#1b2030}
    .btn:active{transform:translateY(1px)}
    .btn--primary{background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-color: transparent;}
    .btn--primary:hover{filter:brightness(1.05)}
    .btn[aria-pressed="true"]{box-shadow:0 0 0 2px rgba(106,166,255,.3) inset; border-color:transparent; background:#21284a}
    .btn--round{width:42px;height:42px;border-radius:50%}
    .btn .icon{font-size:18px}
    .btn.small{padding:6px 8px; font-size:.95rem}

    .spacer{flex:1}
    .time{
      display:flex; align-items:center; gap:10px; width:100%; max-width:520px; margin-left:auto; margin-right:auto;
    }
    input[type="range"]{
      -webkit-appearance:none; appearance:none; width:100%; height:6px; background:#0f1220; border-radius:999px; outline:none; border:1px solid var(--border);
    }
    input[type="range"]::-webkit-slider-thumb{
      -webkit-appearance:none; appearance:none; width:14px; height:14px; background:linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius:50%; border:none; box-shadow:0 0 0 2px #0f1220;
    }
    input[type="range"]::-moz-range-thumb{
      width:14px; height:14px; background:linear-gradient(90deg, var(--accent), var(--accent-2));
      border:none; border-radius:50%
    }
    .timecode{min-width:48px; text-align:center; font-variant-numeric: tabular-nums; color:var(--muted)}

    .volume{
      display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border);
    }
    .volume input[type="range"]{max-width:220px}

    .playlist{
      list-style:none; margin:0; padding:0; max-height:320px; overflow:auto;
    }
    .playlist li{
      border-top:1px solid var(--border);
      background: transparent;
    }
    .track{
      display:flex; align-items:center; gap:14px; width:100%; text-align:left;
      padding:12px 16px; cursor:pointer; background:transparent; border:none; color:inherit;
    }
    .index{
      width:26px; text-align:right; color:var(--muted); font-variant-numeric: tabular-nums;
    }
    .track .t-title{font-weight:600}
    .track .t-artist{color:var(--muted); font-size:.9rem}
    .row{display:flex; align-items:center; gap:10px; min-width:0}
    .grow{min-width:0; flex:1}
    .badge{
      font-size:.75rem; color:#a5b4fc; background:#1b1f35; border:1px solid var(--border);
      padding:4px 8px; border-radius:999px;
    }
    li.active{background: linear-gradient(90deg, rgba(61,220,151,.12), rgba(106,166,255,.10))}
    li.active .index{color:var(--accent-3)}
    .sr-only{position:absolute!important; width:1px;height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
  </style>
</head>
<body>
  <div class="player" role="region" aria-label="Music player">
    <div class="header">
      <img class="cover" id="cover" src="https://picsum.photos/seed/helix1/300/300" alt="Album cover" />
      <div class="meta">
        <div class="title" id="title">—</div>
        <div class="artist" id="artist">—</div>
        <div class="subtle" id="nowPlaying">0 of 0</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn--round" id="btnShuffle" aria-pressed="false" title="Shuffle">
        <span class="icon">🔀</span>
        <span class="sr-only">Toggle shuffle</span>
      </button>

      <button class="btn btn--round" id="btnPrev" title="Previous">
        <span class="icon">⏮️</span>
        <span class="sr-only">Previous track</span>
      </button>

      <button class="btn btn--round btn--primary" id="btnPlay" title="Play/Pause">
        <span class="icon" id="iconPlay">▶️</span>
        <span class="sr-only">Play or pause</span>
      </button>

      <button class="btn btn--round" id="btnNext" title="Next">
        <span class="icon">⏭️</span>
        <span class="sr-only">Next track</span>
      </button>

      <button class="btn btn--round" id="btnRepeat" aria-pressed="false" title="Repeat">
        <span class="icon" id="iconRepeat">🔁</span>
        <span class="sr-only">Toggle repeat</span>
      </button>

      <div class="spacer"></div>

      <div class="time" style="flex:1 1 420px">
        <span class="timecode" id="currentTime">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
        <span class="timecode" id="duration">0:00</span>
      </div>
    </div>

    <div class="volume">
      <button class="btn btn--round small" id="btnMute" title="Mute">
        <span class="icon" id="iconMute">🔊</span>
        <span class="sr-only">Toggle mute</span>
      </button>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
      <span class="subtle">Volume</span>
    </div>

    <div class="grid">
      <ul class="playlist" id="playlist" aria-label="Playlist"></ul>
      <div style="padding:14px 16px">
        <p class="subtle">Tips</p>
        <ul class="subtle" style="line-height:1.6; padding-left:18px; margin-top:8px">
          <li>Click a track to play it</li>
          <li>Drag the bar to seek</li>
          <li>Use shuffle 🔀 and repeat 🔁 / 🔂</li>
          <li>Spacebar toggles play/pause</li>
        </ul>
      </div>
    </div>

    <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
  </div>

  <script>
    // Provide your own tracks here (title, artist, src, cover)
    const tracks = [
      {
        title: "SoundHelix Song 1",
        artist: "SoundHelix",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        cover: "https://picsum.photos/seed/helix1/300/300"
      },
      {
        title: "SoundHelix Song 2",
        artist: "SoundHelix",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
        cover: "https://picsum.photos/seed/helix2/300/300"
      },
      {
        title: "SoundHelix Song 3",
        artist: "SoundHelix",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
        cover: "https://picsum.photos/seed/helix3/300/300"
      }
    ];

    // DOM
    const audio = document.getElementById("audio");
    const cover = document.getElementById("cover");
    const titleEl = document.getElementById("title");
    const artistEl = document.getElementById("artist");
    const nowPlayingEl = document.getElementById("nowPlaying");

    const btnPlay = document.getElementById("btnPlay");
    const iconPlay = document.getElementById("iconPlay");
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const btnShuffle = document.getElementById("btnShuffle");
    const btnRepeat = document.getElementById("btnRepeat");
    const iconRepeat = document.getElementById("iconRepeat");

    const seek = document.getElementById("seek");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");

    const btnMute = document.getElementById("btnMute");
    const iconMute = document.getElementById("iconMute");
    const vol = document.getElementById("volume");

    const playlistEl = document.getElementById("playlist");

    // State
    let currentIndex = 0;
    let isSeeking = false;
    let isShuffle = false;         // false | true
    let repeatMode = "off";        // "off" | "all" | "one"

    // Build playlist UI
    function buildPlaylist(){
      playlistEl.innerHTML = "";
      tracks.forEach((t, i) => {
        const li = document.createElement("li");
        li.dataset.index = i;

        const btn = document.createElement("button");
        btn.className = "track";
        btn.setAttribute("aria-label", `Play ${t.title} by ${t.artist}`);

        btn.innerHTML = `
          <span class="index">${String(i+1).padStart(2,"0")}</span>
          <div class="row grow">
            <div class="t-title">${t.title}</div>
            <div class="t-artist">${t.artist}</div>
          </div>
          <span class="badge">Play</span>
        `;
        btn.addEventListener("click", () => loadTrack(i, true));
        li.appendChild(btn);
        playlistEl.appendChild(li);
      });
      highlightActive();
    }

    function highlightActive(){
      [...playlistEl.children].forEach((li, i) => {
        li.classList.toggle("active", i === currentIndex);
      });
    }

    function loadTrack(index, autoplay=false){
      currentIndex = index;
      const t = tracks[currentIndex];
      audio.src = t.src;
      cover.src = t.cover;
      cover.alt = `${t.title} cover art`;
      titleEl.textContent = t.title;
      artistEl.textContent = t.artist;
      nowPlayingEl.textContent = `${currentIndex+1} of ${tracks.length}`;

      // Reset UI
      seek.value = 0;
      currentTimeEl.textContent = "0:00";
      durationEl.textContent = "0:00";

      highlightActive();

      if (autoplay) {
        audio.play().catch(()=>{ /* ignore autoplay block */ });
      }
    }

    function togglePlay(){
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    function nextTrack(autoPlay = true){
      if (isShuffle) {
        let next = currentIndex;
        // ensure different track if possible
        if (tracks.length > 1) {
          while (next === currentIndex) next = Math.floor(Math.random() * tracks.length);
        }
        loadTrack(next, autoPlay);
        return;
      }

      if (currentIndex < tracks.length - 1) {
        loadTrack(currentIndex + 1, autoPlay);
      } else if (repeatMode === "all") {
        loadTrack(0, autoPlay);
      } else {
        // repeat off and at end: stop
        audio.pause();
        audio.currentTime = 0;
        iconPlay.textContent = "▶️";
      }
    }

    function prevTrack(autoPlay = true){
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      if (currentIndex > 0) {
        loadTrack(currentIndex - 1, autoPlay);
      } else if (repeatMode === "all") {
        loadTrack(tracks.length - 1, autoPlay);
      } else {
        audio.currentTime = 0;
      }
    }

    function formatTime(sec){
      if (!isFinite(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ":" + String(s).padStart(2, "0");
    }

    // Events
    btnPlay.addEventListener("click", togglePlay);
    btnPrev.addEventListener("click", () => prevTrack(true));
    btnNext.addEventListener("click", () => nextTrack(true));

    btnShuffle.addEventListener("click", () => {
      isShuffle = !isShuffle;
      btnShuffle.setAttribute("aria-pressed", String(isShuffle));
    });

    btnRepeat.addEventListener("click", () => {
      // off -> all -> one -> off
      repeatMode = repeatMode === "off" ? "all" : repeatMode === "all" ? "one" : "off";
      btnRepeat.setAttribute("aria-pressed", repeatMode !== "off");
      iconRepeat.textContent = repeatMode === "one" ? "🔂" : "🔁";
      btnRepeat.title = repeatMode === "off" ? "Repeat off" : repeatMode === "one" ? "Repeat one" : "Repeat all";
    });

    seek.addEventListener("input", () => {
      isSeeking = true;
      const pct = Number(seek.value) / 100;
      currentTimeEl.textContent = formatTime(audio.duration * pct);
    });
    seek.addEventListener("change", () => {
      const pct = Number(seek.value) / 100;
      if (isFinite(audio.duration)) audio.currentTime = audio.duration * pct;
      isSeeking = false;
    });

    vol.addEventListener("input", () => {
      audio.volume = Number(vol.value);
      audio.muted = audio.volume === 0;
      iconMute.textContent = audio.muted ? "🔇" : "🔊";
    });

    btnMute.addEventListener("click", () => {
      audio.muted = !audio.muted;
      iconMute.textContent = audio.muted ? "🔇" : "🔊";
    });

    audio.addEventListener("play", () => {
      iconPlay.textContent = "⏸️";
      btnPlay.title = "Pause";
    });
    audio.addEventListener("pause", () => {
      iconPlay.textContent = "▶️";
      btnPlay.title = "Play";
    });
    audio.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(audio.duration);
    });
    audio.addEventListener("timeupdate", () => {
      if (!isSeeking && isFinite(audio.duration)) {
        const pct = (audio.currentTime / audio.duration) * 100;
        seek.value = pct;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    });
    audio.addEventListener("ended", () => {
      if (repeatMode === "one") {
        audio.currentTime = 0;
        audio.play();
      } else {
        nextTrack(true);
      }
    });

    // Keyboard: Space toggles play/pause when player is focused
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        togglePlay();
      } else if (e.code === "ArrowRight" && e.shiftKey) {
        nextTrack(true);
      } else if (e.code === "ArrowLeft" && e.shiftKey) {
        prevTrack(true);
      }
    });

    // Init
    buildPlaylist();
    loadTrack(0, false);
  </script>
</body>
</html>
