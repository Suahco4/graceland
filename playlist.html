<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Music Playlist</title>
    <link rel="stylesheet" href="playlist.css">
</head>
<body>
    <div class="playlist-container">
        <h2>My Music Playlist</h2>
        <select id="playlist-select">
            <option value="" disabled selected>Select a song</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" data-title="Song 1 - Upbeat Track">Song 1 - Upbeat Track</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" data-title="Song 2 - Chill Vibes">Song 2 - Chill Vibes</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" data-title="Song 3 - Energetic Beat">Song 3 - Energetic Beat</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" data-title="Song 4 - Relaxing Melody">Song 4 - Relaxing Melody</option>
        </select>
        <p id="selected-song">No song selected</p>
        <audio id="audio-player" controls></audio>
    </div>

    <script src="playlist.js"></script>
</body>
</html>
